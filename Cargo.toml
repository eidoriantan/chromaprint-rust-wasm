[package]
name = "chromaprint-web"
version = "1.0.0"
description = "A pure Rust implementation of Chromaprint, compiled to WebAssembly"
license = "UNLICENSED"
homepage = "https://github.com/eidoriantan/chromaprint-rust-wasm"
repository = "https://github.com/eidoriantan/chromaprint-rust-wasm"
edition = "2015"
authors = [
  "Martin Charles <martincharles07@gmail.com>",
  "Adriane Justine Tan <me@eidoriantan.com>"
]

[dependencies]
rustfft = { git = "https://github.com/awelkie/RustFFT.git" }
base64 = "0.10.0"
wasm-bindgen = "0.2"

[dev-dependencies]
approx = "0.3.0"

[lib]
crate-type = ["cdylib", "rlib"]
